name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Models are SHA-256 pinned in the script, so its hash is a sound cache key.
      - uses: actions/cache@v4
        with:
          path: public/models
          key: pose-models-${{ hashFiles('scripts/fetch-models.mjs') }}
      - run: npm run fetch-models
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # typecheck already ran above; `npm run build` would repeat tsc -b.
      - run: npx vite build
